<!DOCTYPE html>
<html lang="en" xmlns:wicket="http://www.w3.org/1999/xhtml">
<body>
<wicket:panel>
  <form wicket:id="ruleForm">
    <div wicket:id="container">
      <div class="form-text">
        When the condition matches, use the value below as the default instead of the plain
        default value. The first matching rule wins.
      </div>
      <div class="d-flex flex-column">
        <input wicket:id="condition" class="form-control mb-1" placeholder="Condition, e.g. entityType == &quot;Gene&quot;"/>
        <div class="flex-fill">
          <div class="input-group">
            <div wicket:id="value" class="flex-fill"/>
            <button wicket:id="addRule" class="btn btn-sm btn-primary pull-right">
              <i class="fas fa-plus" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
      <div class="flex-v-container flex-gutter">
        <div wicket:id="rules" class="flex-h-container flex-gutter flex-only-internal-gutter">
          <div class="flex-content">
            <span wicket:id="condition"/>
            <span>&#8594;</span>
            <span wicket:id="value"/>
          </div>
          <div class="flex-h-container flex-centered" style="white-space:nowrap;">
            <a wicket:id="removeRule" class="btn-sm btn-danger pull-right">
              <i class="fas fa-trash" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </form>
</wicket:panel>
</body>
</html>
