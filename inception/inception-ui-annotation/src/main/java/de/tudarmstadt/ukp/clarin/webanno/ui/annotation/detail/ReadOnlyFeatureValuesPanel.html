<html xmlns:wicket="http://wicket.apache.org">
<body>
  <wicket:panel>
    <div class="mt-2 border-top pt-2">
      <div class="small text-muted mb-2">
        <i class="fas fa-lock me-1"></i><wicket:message key="readOnly.notice"/>
      </div>
      <div wicket:id="noFeaturesNotice" class="text-muted">
        <wicket:message key="readOnly.noFeatures"/>
      </div>
      <dl class="mb-0">
        <wicket:container wicket:id="features">
          <dt wicket:id="name"></dt>
          <dd class="text-break">
            <div wicket:id="value"></div>
            <div wicket:id="noValue" class="text-muted">&ndash;</div>
            <div wicket:id="identifiers" class="small">
              <a wicket:id="link" target="_blank" rel="noopener noreferrer"></a>
              <code wicket:id="text"></code>
            </div>
          </dd>
        </wicket:container>
      </dl>
    </div>
  </wicket:panel>
</body>
</html>
